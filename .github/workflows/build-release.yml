name: Build & Release Dictionaries

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Manifest version (YYYY.MM.N)"
        required: true
        default: ""
      pairs:
        description: "Comma-separated subset (default: all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +'%Y.%m.1')" >> $GITHUB_OUTPUT
          fi
          tag="v$(cat $GITHUB_OUTPUT | grep version | cut -d= -f2)"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: scripts
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: |
          python build_all.py \
            --version "${{ steps.ver.outputs.version }}" \
            --release-tag "${{ steps.ver.outputs.tag }}" \
            ${{ inputs.pairs && format('--pairs "{0}"', inputs.pairs) || '' }}

      - name: Create release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Dictionary data ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dictionaries/*.sqlite3
            manifest.json
            manifest.schema.json
            ATTRIBUTIONS.md
            LICENSE

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest.json to ${{ steps.ver.outputs.version }}" || true
          git push
